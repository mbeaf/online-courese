<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Online Courses{% endblock %}</title>
    <style>
        body { font: 1rem/1.5 system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
        fieldset, article { margin: 1rem 0; padding: 1rem; border: 1px solid #aaa; }
        fieldset label { display: block; margin: .35rem 0; }
        button { font: inherit; padding: .4rem .8rem; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav aria-label="Main" style="display: flex; align-items: center; flex-wrap: wrap; gap: 1rem;">
        <a href="{% url 'onlinecourse:course_list' %}">Course catalog</a>
        {% if user.is_authenticated %}
        <span>Signed in as {{ user.get_username }}</span>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Sign out</button>
        </form>
        {% else %}
        <a href="{% url 'login' %}">Sign in</a>
        <a href="{% url 'onlinecourse:register' %}">Create account</a>
        {% endif %}
    </nav>
    <main>{% block content %}{% endblock %}</main>
</body>
</html>
